<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="95" fill="#0a66c2" />
  <circle cx="100" cy="100" r="85" fill="#ffffff" />
  
  <!-- LinkedIn-inspired Icon -->
  <g transform="translate(40, 40)">
    <!-- World/Globe icon combined with LinkedIn style -->
    <circle cx="60" cy="60" r="50" fill="#0a66c2" stroke="#ffffff" stroke-width="2" />
    
    <!-- Grid lines representing the globe -->
    <line x1="10" y1="60" x2="110" y2="60" stroke="#ffffff" stroke-width="2" />
    <line x1="60" y1="10" x2="60" y2="110" stroke="#ffffff" stroke-width="2" />
    
    <!-- Curved lines representing latitude -->
    <path d="M 20,40 Q 60,20 100,40" stroke="#ffffff" stroke-width="2" fill="none" />
    <path d="M 20,80 Q 60,100 100,80" stroke="#ffffff" stroke-width="2" fill="none" />
    
    <!-- Lowercase "i" representing "information" and LinkedIn -->
    <circle cx="45" cy="45" r="10" fill="#ffffff" />
    <rect x="45" y="60" width="10" height="30" rx="5" fill="#ffffff" />
    
    <!-- Small pulse effect around the icon -->
    <circle cx="60" cy="60" r="60" stroke="#ffffff" stroke-width="1" stroke-opacity="0.5" fill="none" />
  </g>
</svg>
